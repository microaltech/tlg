<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · Tuan Nusantara</title>
<link rel="icon" href="icon.png">
<style>
	:root { --bg: #f6efe1; --card: #fffaf0; --ink: #2b1d10; --muted: #7a6650; --gold: #b8862f; --red: #8e2b22; --line: #e2d3b5; }
	@media (prefers-color-scheme: dark) { :root { --bg: #1b140e; --card: #261c13; --ink: #f2e6d0; --muted: #b8a588; --line: #3d2f20; } }
	* { box-sizing: border-box; }
	body { margin: 0; font: 16px/1.6 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
	header { background: #5e1810; color: #f6e7b0; padding: 14px 16px; }
	header .wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
	header img { width: 40px; height: 40px; border-radius: 10px; }
	header a { color: #f6e7b0; text-decoration: none; }
	header nav { margin-left: auto; display: flex; gap: 14px; font-size: 15px; flex-wrap: wrap; }
	.wrap { max-width: 860px; margin: 0 auto; }
	main { padding: 20px 16px 48px; }
	h1 { font-size: 26px; } h2 { font-size: 20px; margin-top: 28px; }
	a { color: var(--red); }
	table { border-collapse: collapse; width: 100%; background: var(--card); font-size: 14px; }
	th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
	.scroll { overflow-x: auto; }
	code { background: var(--card); padding: 1px 4px; border-radius: 4px; }
	.btn { display: inline-block; background: var(--gold); color: #fff; padding: 12px 20px; border-radius: 10px;
		text-decoration: none; font-weight: 600; }
	.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 14px 0; }
	footer { color: var(--muted); font-size: 14px; padding: 16px; text-align: center; }
</style>
</head>
<body>
<header><div class="wrap">
	<img src="icon.png" alt=""><a href="index.html"><strong>Tuan Nusantara</strong></a>
	<nav><a href="index.html">Beranda</a><a href="privasi.html">Privasi</a><a href="hapus-akun.html">Hapus Akun</a></nav>
</div></header>
<main class="wrap">
{{body}}
</main>
<footer>© [NAMA PENGEMBANG] · Kontak: [EMAIL KONTAK]</footer>
</body>
</html>
